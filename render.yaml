services:
  - type: web
    name: lifesync-backend
    runtime: node
    plan: free
    rootDir: backend
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifesync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: NODE_ENV
        value: production

databases:
  - name: lifesync-db
    region: oregon
    plan: free
    postgresMajorVersion: "18"
    databaseName: lifesync
    user: lifesync
    connectionPool: none
    ipAllowList: []
